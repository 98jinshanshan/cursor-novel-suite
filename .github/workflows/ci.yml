name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "cursor-novel-writer/**/*.md" "cursor-novel-video/**/*.md" "docs/**/*.md" "*.md"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: |
          pip install -r requirements-dev.txt
          pip install -r cursor-novel-writer/requirements.txt
          pip install -r cursor-novel-video/requirements.txt
      - name: pyright
        run: npx --yes pyright -p pyrightconfig.json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements-dev.txt
          pip install -r cursor-novel-writer/requirements.txt
          pip install -r cursor-novel-video/requirements.txt
      - name: compileall
        run: |
          python -m compileall -q cursor-novel-writer/engine cursor-novel-video/engine
      - name: pytest (no ffmpeg)
        run: pytest -m "not ffmpeg" -q
      - name: suite doctor
        run: python cursor-novel-writer/engine/novel_cli.py suite doctor --core-only
      - name: NEC smoke (writer + video)
        run: |
          python cursor-novel-writer/engine/scripts/nec_cursor_smoke.py
          python cursor-novel-video/engine/scripts/nec_video_smoke.py

  test-ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: |
          pip install -r requirements-dev.txt
          pip install -r cursor-novel-video/requirements.txt
      - name: pytest ffmpeg
        run: pytest cursor-novel-video/tests -m ffmpeg -q
