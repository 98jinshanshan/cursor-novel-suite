[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "novel-suite"
version = "2.0.0"
description = "Novel Suite 2.0 — writer/video CLI with JSON Result Contract for agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.0",
]
epub = [
  "ebooklib>=0.18",
]
memory = [
  "qdrant-client>=1.9",
  "sentence-transformers>=3.0",
]
server = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.scripts]
novel-suite = "novel_suite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_suite"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/novel_suite",
  "/skills/openclaw-novel-suite",
]

[tool.pytest.ini_options]
markers = [
  "ffmpeg: tests that require FFmpeg on PATH",
  "live_comfyui: tests that require localhost ComfyUI on :8188",
  "local_ch02: tests that read local novels/novel-837dd4f1/video/ch02 artifacts",
]
testpaths = [
  "tests",
  "cursor-novel-writer/tests",
  "cursor-novel-video/tests",
]
