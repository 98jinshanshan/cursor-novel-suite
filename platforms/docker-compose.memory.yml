# Qdrant for novel-suite memory — localhost only (Sprint 0 Day 2 / CHK-005)
# Usage: docker compose -f platforms/docker-compose.memory.yml up -d

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: novel-suite-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
